name: Test API
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.8.2
      - name: Deploy API Docker Image
        run: |
          docker pull coherentsolutions/rest-training:2.0
          docker run -d -p 8082:8082 coherentsolutions/rest-training:2.0
          sleep 15
      - name: Build with Maven
        run: mvn clean install
      - name: Run Tests
        run: mvn test
      - name: Checkout github pages with previous Allure reports
        uses: actions/checkout@v4
        continue-on-error: true
        with:
            ref: gh-pages
            path: gh-pages-dir
      - name: Generate Allure test report
        uses: andgineer/allure-report@v3.5
        id: allure-report
        if: always()
        with:
            allure-results: allure-results
            website: gh-pages-dir
            reports-site-path: builds/tests
      - name: Publish Allure test report
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ always() && (steps.allure-report.outcome == 'success') }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{ steps.allure-report.outputs.reports-site }}
          destination_dir: ${{ steps.allure-report.outputs.reports-site-path }}