name: Test API
on:
  push:
    branches: [ final ]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TOKEN_ENDPOINT: ${{ secrets.TOKEN_ENDPOINT }}
      USERNAME2: ${{ secrets.USERNAME2 }}
      PASSWORD: ${{ secrets.PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
            maven-version: 3.8.2

      - name: Deploy API Docker Image
        run: |
          docker pull coherentsolutions/rest-training:2.0
          docker run -d -p 49000:8082 coherentsolutions/rest-training:2.0
          echo "Waiting for API to be ready"
          sleep 30
      - name: Build with Maven
        run:  mvn clean install -Dsurefire.testFailureIgnore=true || true

      - name: Publish Junit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: target/surefire-reports

      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
            ref: gh-pages
            path: gh-pages

      - name: Build test report
        uses: simple-elf/allure-report-action@v1.7
        if: always()
        with:
            gh_pages: gh-pages
            allure_history: allure-history
            allure_results: build/allure-results

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_branch: gh-pages
            publish_dir: allure-history
